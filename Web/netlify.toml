# Configuración de Netlify para la web del cliente (dominio principal).
# En Netlify, este sitio debe tener "Base directory" = Web

[build]
  command = "npm run build"
  publish = "dist"

# React Router (SPA): cualquier ruta cae en index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Encabezados de seguridad (recomendación del análisis de seguridad) ──
# Nota: el CSP permite los orígenes que el sitio usa (Izipay, Yape/MercadoPago,
# Google Analytics, Clarity, iconos jsDelivr y la API en Railway). Si se agrega
# un proveedor nuevo, hay que sumarlo aquí. Verificar un pago real tras desplegar.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.micuentaweb.pe https://sdk.mercadopago.com https://http2.mlstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://static.micuentaweb.pe https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net https://static.micuentaweb.pe; img-src 'self' data: blob: https:; connect-src 'self' https://transporterayza-production.up.railway.app https://api.micuentaweb.pe https://static.micuentaweb.pe https://api.mercadopago.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.clarity.ms https://*.clarity.ms https://c.bing.com; frame-src 'self' https://static.micuentaweb.pe https://*.micuentaweb.pe https://sdk.mercadopago.com https://*.mercadopago.com"

# Variables de entorno (Site settings → Environment variables):
#   VITE_API_URL = https://transporterayza-production.up.railway.app
#
# Izipay no necesita variables acá: su clave pública la envía el backend con cada
# compra, y las credenciales viven solo en el servidor (IZIPAY_* en Railway).
