# Publica la web del cliente al mergear a main.
#
# Antes se subía arrastrando la carpeta dist a Netlify a mano. Eso ya costó una
# vez: el netlify.toml queda fuera de dist, así que los encabezados de seguridad
# nunca llegaban al sitio. Con el despliegue automático se sube siempre lo mismo
# que hay en main.
name: Publicar web del cliente

on:
  push:
    branches: [main]
    paths:
      - 'Web/**'
      - '.github/workflows/desplegar-web.yml'
  workflow_dispatch:          # también se puede lanzar a mano desde GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin las credenciales de Netlify no hay nada que hacer: se avisa y se corta
      # sin marcar el flujo en rojo, para no ensuciar el historial.
      - name: Comprobar credenciales
        id: credenciales
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "listo=no" >> $GITHUB_OUTPUT
            echo "::warning::Falta configurar NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID en los secretos del repositorio. La web no se publicó."
            {
              echo "## ⚠️ NO se publicó"
              echo ""
              echo "Faltan los secretos \`NETLIFY_AUTH_TOKEN\` y/o \`NETLIFY_SITE_ID\`."
              echo "El sitio en vivo sigue con la versión anterior."
              echo ""
              echo "Se configuran una sola vez en **Settings → Secrets and variables → Actions**."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "listo=si" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.credenciales.outputs.listo == 'si'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Construir
        if: steps.credenciales.outputs.listo == 'si'
        working-directory: Web
        env:
          # La dirección del backend no es secreta: viaja dentro del JavaScript que
          # descarga cualquier visitante. Se puede cambiar sin tocar el código con
          # una variable del repositorio (Settings → Variables), y si no está, se
          # usa la de producción: así nunca queda apuntando a localhost por olvido.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://transporterayza-production.up.railway.app' }}
        run: |
          npm ci
          npm run build

      - name: Publicar en Netlify
        if: steps.credenciales.outputs.listo == 'si'
        working-directory: Web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy --dir=dist --prod \
            --message "main ${{ github.sha }}" | tee salida.txt
          {
            echo "## ✅ Publicado"
            echo ""
            grep -iE "website url|unique deploy url|build logs" salida.txt || true
          } >> $GITHUB_STEP_SUMMARY
