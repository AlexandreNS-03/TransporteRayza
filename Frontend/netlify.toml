# Configuración de Netlify para el sistema administrativo.
# En Netlify, este sitio debe tener "Base directory" = Frontend
#
# Antes se subía arrastrando la carpeta dist, y así este archivo nunca llegaba al
# sitio: el sistema quedaba sin ningún encabezado de seguridad. Con el despliegue
# automático (.github/workflows/desplegar-sistema.yml) sí se aplica.

[build]
  command = "npm run build"
  publish = "dist"

# React Router (SPA): cualquier ruta cae en index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Encabezados de seguridad ──
# El sistema maneja datos de pasajeros y dinero: conviene que el navegador
# bloquee lo que no debería pasar. Los orígenes permitidos son los que se usan:
# la API en Railway y los iconos de jsDelivr.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://transporterayza-production.up.railway.app https://cdn.jsdelivr.net"

# Los archivos con huella en el nombre no cambian nunca: se pueden guardar mucho.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Variables de entorno (Site settings → Environment variables):
#   VITE_API_URL = https://transporterayza-production.up.railway.app
